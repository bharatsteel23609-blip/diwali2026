<title>BSC Diwali Scorekeeper</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Sticky header with sync status, fixed bottom tabs, big tap targets.
   Team A is blue and Team B is gold everywhere; all else stays neutral navy so scores read first. */
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0B1B2E; --muted:#51627A; --line:#D5DDE8;
  --blue:#0F6BB5; --on-blue:#FFFFFF; --blue-soft:#E3EFFA; --a-text:#0F6BB5;
  --gold:#F2A900; --on-gold:#0B1B2E; --gold-soft:#FFF3D1; --b-text:#7A5200;
  --good:#1B7F4B; --good-soft:#DDF3E6; --bad:#B3261E; --bad-soft:#FBE4E1;
  --navy:#0B1B2E; --on-navy:#FFFFFF;
  --display:'Anton',Impact,'Arial Narrow',sans-serif; --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131F; --surface:#10233A; --ink:#EAF1F8; --muted:#9FB2C8; --line:#25405B;
  --blue:#1479C9; --blue-soft:#12324F; --a-text:#6DB8F2;
  --gold-soft:#3A2D08; --b-text:#F2B93A;
  --good:#4CC28A; --good-soft:#123A27; --bad:#FF8A80; --bad-soft:#41191A;
  --navy:#050D16; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08131F; --surface:#10233A; --ink:#EAF1F8; --muted:#9FB2C8; --line:#25405B;
  --blue:#1479C9; --blue-soft:#12324F; --a-text:#6DB8F2;
  --gold-soft:#3A2D08; --b-text:#F2B93A;
  --good:#4CC28A; --good-soft:#123A27; --bad:#FF8A80; --bad-soft:#41191A;
  --navy:#050D16; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--a-text)}
h1,h2,h3,p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding-bottom:104px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.top img{width:44px;height:auto;display:block}
.brand{display:flex;flex-direction:column;line-height:1;min-width:0;flex:1}
.brand b{white-space:nowrap;font-family:var(--display);font-weight:400;font-size:18px;letter-spacing:.5px;text-transform:uppercase}
.brand span{font-size:12px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.5px;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.live i{background:var(--good)} .sync.local i{background:var(--gold)} .sync.err i{background:var(--bad)}
.gear{min-width:44px;min-height:44px;display:grid;place-items:center;border-radius:10px;color:var(--muted);font-size:13px;font-weight:700;text-decoration:none}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px)}
.tabs nav{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:720px}
.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:700;letter-spacing:.3px}
.tabs a[aria-current="page"]{color:var(--a-text)}
.tabs a[aria-current="page"] svg{stroke-width:2.6}
.tabs svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* type */
.eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted)}
.h1{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:.4px;text-transform:uppercase;text-wrap:balance}
.h2{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink)}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h small{color:var(--muted);font-size:13px}
.muted{color:var(--muted)}
.empty{color:var(--muted);font-size:15px;padding:12px 0}
.page-h{display:flex;flex-direction:column;gap:4px;padding-top:18px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:44px;font-weight:700;text-decoration:none;color:var(--a-text);margin-top:4px}

/* cards, rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.nm{overflow-wrap:break-word}
.tb{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font-family:var(--display);font-size:14px;flex:none;line-height:1}
.tb.a{background:var(--blue);color:var(--on-blue)} .tb.b{background:var(--gold);color:var(--on-gold)}
.chip-s{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.4px;padding:4px 9px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.chip-s.live{background:var(--gold-soft);color:var(--b-text);border-color:var(--gold)}
.chip-s.done{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.badge{font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--blue-soft);color:var(--a-text);white-space:nowrap}
.warn{background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold);border-radius:10px;padding:10px 12px;font-size:15px}
.note{background:var(--blue-soft);border-radius:10px;padding:10px 12px;font-size:15px}

/* buttons */
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1px solid transparent;font-weight:700;font-size:16px;cursor:pointer;background:var(--navy);color:var(--on-navy);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.blue{background:var(--blue);color:var(--on-blue)} .btn.gold{background:var(--gold);color:var(--on-gold)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.go{background:var(--good);color:#fff} .btn.stop{background:var(--bad);color:#fff}
.btn.danger{background:var(--bad);color:#fff}
.btn.full{width:100%} .btn.sq{min-width:46px;padding:0}
.x{min-width:44px;min-height:44px;background:none;border:0;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:8px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1 1 auto}

/* scoreboard */
.score{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:16px}
.sc{border-radius:14px;padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px}
.sc.a{background:var(--blue);color:var(--on-blue)} .sc.b{background:var(--gold);color:var(--on-gold)}
.sc-l{font-size:13px;font-weight:700;letter-spacing:2px}
.sc-n{font-family:var(--display);font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.sc-s{font-size:14px;font-weight:600}
.bar{height:10px;border-radius:99px;background:var(--gold);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--blue)}
.lead{font-weight:700;margin-top:8px;font-size:17px}
.prog{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.prog a{display:grid;place-items:center;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--display);font-size:18px;color:var(--muted);text-decoration:none}
.prog a.live{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.prog a.done{background:var(--good);color:#fff;border-color:var(--good)}
.next{display:flex;align-items:center;gap:12px;background:var(--navy);color:var(--on-navy);border-radius:14px;padding:14px;margin-top:16px}
.next .h2{color:#fff;font-size:24px}
.next .eyebrow{color:#C5D3E3}
.next .btn{background:var(--gold);color:var(--on-gold)}

/* games list */
.gcard{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:var(--ink);min-height:68px}
.gn{font-family:var(--display);font-size:26px;width:34px;color:var(--a-text);text-align:center;flex:none}
.gcard .res{font-size:14px;color:var(--muted);margin-top:2px}
.gcard b{font-size:18px}

/* game detail */
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);margin-top:10px}
.seg button{min-height:46px;border:0;background:transparent;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);color:var(--on-navy)}
.clocks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.clock-card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.clock-card.A{border-top:6px solid var(--blue)} .clock-card.B{border-top:6px solid var(--gold)}
.clock-card.s{align-items:stretch}
.cl{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.clock{font-family:var(--display);font-size:46px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.clock.over{color:var(--bad)}
.cap{font-size:13px;color:var(--muted)}
.clock-card .row>.btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.pchip{font-size:15px;display:flex;align-items:center;gap:8px;min-height:50px;padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;font-weight:600;line-height:1.15}
.pchip.on{outline:3px solid var(--gold);border-color:var(--gold)}
.pchip small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pchip.dim{opacity:.6}
.step{display:flex;gap:8px;align-items:stretch}
.step input,.fld{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;font-size:20px;font-weight:700;width:100%;min-width:0}
.step input{text-align:center}
.fld.sm{font-size:16px}
label.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.5px}
.stand h3{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
.stand li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 4px 4px 12px;min-height:48px}
.rk{font-family:var(--display);font-size:20px;width:22px;color:var(--muted)}
.val{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dec{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.dec .card{display:flex;flex-direction:column;gap:6px;min-height:108px}
.dec .big{font-family:var(--display);font-size:22px;line-height:1.1;text-transform:uppercase;overflow-wrap:break-word}
.tick{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px;font-weight:600;cursor:pointer}
.tick input{width:22px;height:22px;accent-color:var(--good)}
select.fld{font-size:16px;font-weight:500}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.cmp .card{display:flex;flex-direction:column;gap:2px}
.cmp .big{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.dec3{display:grid;grid-template-columns:1fr auto 1fr;gap:8px}
.lock{opacity:.55;pointer-events:none}

/* players */
.pl li{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px 6px 12px;min-height:54px}
.pl li.off{opacity:.55}
.pl small{color:var(--muted);display:block;font-size:13px}
.wins{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}

/* announcement */
.show{position:fixed;inset:0;z-index:50;background:var(--navy);color:#fff;display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.show-b{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:720px;width:100%;margin:0 auto;animation:rise .35s ease-out}
@keyframes rise{from{opacity:.0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.show-b{animation:none}}
.show .eyebrow{color:#C5D3E3;font-size:14px}
.show .huge{font-family:var(--display);font-size:clamp(40px,12vw,84px);line-height:1;text-transform:uppercase;text-wrap:balance}
.pod{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:14px;padding:14px 16px}
.pod .pos{font-family:var(--display);font-size:34px;width:44px;color:var(--gold)}
.pod .who{font-family:var(--display);font-size:clamp(24px,7vw,40px);text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.fin{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fin div{border-radius:14px;padding:16px;text-align:center}
.fin .a{background:var(--blue)} .fin .b{background:var(--gold);color:var(--on-gold)}
.fin b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(56px,20vw,110px);line-height:1}
.show-n{display:flex;gap:10px;max-width:720px;width:100%;margin:0 auto}
.show-n .btn{flex:1;background:rgba(255,255,255,.14);color:#fff}
.show-n .btn.gold{background:var(--gold);color:var(--on-gold)}
textarea.out{width:100%;min-height:220px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:12px;font-size:14px;line-height:1.45}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;max-width:90vw}
</style>
<div id="app" class="wrap" aria-live="polite"></div>
<div id="toast" hidden></div>

var COLS=['games','entries','config','tambola','ootd'];

function clone(o){return JSON.parse(JSON.stringify(o))}
function merge(t,p){for(var k in p){var v=p[k];if(v&&typeof v==='object'&&!Array.isArray(v)){if(!t[k]||typeof t[k]!=='object')t[k]={};merge(t[k],v)}else t[k]=v}return t}
function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j)COLS.forEach(function(c){DATA[c]=j[c]||{}})}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(DATA))}catch(e){}}
function fail(){toast('Could not save. Check the connection and try again.');mode='err';render()}
function put(col,id,patch){
  var had=!!DATA[col][id]; patch=clone(patch);
  DATA[col][id]=merge(had?DATA[col][id]:{},patch);
  if(db){var ref=db.collection(col).doc(id);
    (had?ref.update(patch):ref.set(DATA[col][id])).catch(function(e){
      if(e&&e.code==='invalid_argument'){ref.set(DATA[col][id]).catch(fail)}else fail()});
  }else lsSave();
  render();
}
function del(col,id){delete DATA[col][id];if(db){db.collection(col).doc(id).delete().catch(fail)}else lsSave();render()}
function subscribe(){
  COLS.forEach(function(c){
    db.collection(c).onSnapshot(function(snap){
      var o={};snap.docs.forEach(function(d){o[d.id]=clone(d.data())});
      DATA[c]=o;mode='live';scheduleRender();
    },function(){mode='err';scheduleRender()});
  });
}

/* ---------- helpers ---------- */
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var G=function(id){return GAMES.filter(function(g){return g.id===id})[0]};
var P=function(id){return ROSTER.filter(function(p){return p.id===id})[0]};
var gdoc=function(id){return DATA.games[id]||{}};
var cfg=function(n){return DATA.config[n]||{}};
var isAbsent=function(pid){return !!(cfg('roster').absent||{})[pid]};
var teamOf=function(pid){var p=P(pid);return p?((cfg('roster').team||{})[pid]||p.team):'A'};
var pname=function(pid){var p=P(pid);return p?p.name:'Not set'};
var tb=function(t){return '<span class="tb '+t.toLowerCase()+'" role="img" aria-label="Team '+t+'">'+t+'</span>'};
var fmtP=function(n){return n%1?n.toFixed(1):String(n)};
function fmtT(ms){if(ms==null)return 'DNF';var t=Math.floor(ms/100)%10,s=Math.floor(ms/1000)%60,m=Math.floor(ms/60000);return m+':'+(s<10?'0':'')+s+'.'+t}
function parseT(str){str=String(str).trim().replace(',','.');if(!str)return null;
  if(str.indexOf(':')>-1){var a=str.split(':'),v=(parseInt(a[0],10)*60+parseFloat(a[1]))*1000;return isFinite(v)?Math.round(v):NaN}
  var x=parseFloat(str);return isFinite(x)?Math.round(x*1000):NaN}
function fmtV(g,v){if(v==null)return 'DNF';var t=g.metric.type;return t==='time'?fmtT(v):t==='dist'?v+' cm':String(v)}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function ico(n){var d={board:'M4 20V10M10 20V4M16 20v-7M2 20h20',games:'M5 4h14v16H5zM9 9h6M9 13h6',players:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM3 19v-1a4 4 0 0 1 4-4h2a4 4 0 0 1 4 4v1M16 6a3 3 0 0 1 0 5M18 14a4 4 0 0 1 3 4v1',
  prizes:'M4 10h16v10H4zM3 7h18v3H3zM12 7v13M12 7C10 3 6 3 7 6c.5 1.5 3 1 5 1zM12 7c2-4 6-4 5-1-.5 1.5-3 1-5 1z',
  finale:'M7 4h10v5a5 5 0 0 1-10 0zM5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3M12 14v4M8 20h8',back:'M15 5l-7 7 7 7',x:'M6 6l12 12M18 6L6 18'}[n];
  return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="'+d+'"/></svg>'}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3200)}

function presentPlayers(who){return ROSTER.filter(function(p){return !isAbsent(p.id)&&(!who||who==='X'||p.g===who)})}
function entriesOf(gid){return Object.keys(DATA.entries).map(function(k){var e=DATA.entries[k];e.id=k;return e}).filter(function(e){return e.gid===gid}).sort(function(a,b){return a.at-b.at})}
function better(g,a,b){var hi=g.metric.better==='high';var av=a==null?(hi?-Infinity:Infinity):a,bv=b==null?(hi?-Infinity:Infinity):b;if(av===bv)return 0;return hi?(bv>av?1:-1):(av<bv?-1:1)}
function bestBy(g,es){var best={};es.forEach(function(e){if(!(e.pid in best))best[e.pid]=e.v==null?null:e.v;else if(e.v!=null&&(best[e.pid]==null||better(g,e.v,best[e.pid])<0))best[e.pid]=e.v});
  var list=Object.keys(best).map(function(p){return{pid:p,v:best[p]}}).sort(function(a,b){return better(g,a.v,b.v)||pname(a.pid).localeCompare(pname(b.pid))});
  var r=1;list.forEach(function(x,i){if(i>0&&better(g,x.v,list[i-1].v)!==0)r=i+1;x.rank=r});return list}
function rankInd(g){var es=entriesOf(g.id).filter(function(e){return e.pid});var fin=es.filter(function(e){return e.stage==='Final'});return bestBy(g,fin.length?fin:es)}
function HEATG(){return GAMES.filter(function(g){return g.kind==='ind'&&g.stages.indexOf('Final')>-1&&g.id!=='bindi'})}
function adv(g){var o=(cfg('adv')||{})[g.id];return o!=null?o:(g.advance||0)}
function qualifiers(g){var out={};if(!adv(g))return out;var es=entriesOf(g.id).filter(function(e){return e.pid&&e.stage!=='Final'});
  g.stages.forEach(function(s){if(s==='Final')return;var l=bestBy(g,es.filter(function(e){return e.stage===s}));if(l.length)out[s]=l.slice(0,adv(g)).map(function(x){return x.pid})});return out}
function allQuals(g){var q=qualifiers(g),a=[];Object.keys(q).forEach(function(k){a=a.concat(q[k])});return a}
function teamAgg(g,t){var es=entriesOf(g.id).filter(function(e){return e.team===t});if(!es.length)return null;
  if(g.agg==='sum'){var by={};es.forEach(function(e){by[e.stage]=e});var ks=Object.keys(by);return{v:ks.reduce(function(s,k){return s+(by[k].v==null?0:by[k].v)},0),n:ks.length,hits:null}}
  var l=es[es.length-1];return{v:l.v,hits:l.hits==null?null:l.hits,n:1}}
function teamSuggest(g){var a=teamAgg(g,'A'),b=teamAgg(g,'B');if(!a||!b)return null;
  if(g.agg==='sum'&&(a.n<g.batches.length||b.n<g.batches.length))return null;
  if(g.hits){var ha=a.hits==null?0:a.hits,hb=b.hits==null?0:b.hits;if(ha!==hb)return ha>hb?'A':'B'}
  if(a.v==null&&b.v==null)return 'draw';if(a.v==null)return 'B';if(b.v==null)return 'A';if(a.v===b.v)return 'draw';return a.v<b.v?'A':'B'}
function pts(g){var o=(cfg('points')||{})[g.id]||{};return{w:o.w!=null?o.w:g.points.w,s:o.s!=null?o.s:g.points.s}}
function totals(){var t={A:0,B:0,played:0,left:0};GAMES.filter(function(g){return g.kind==='team'}).forEach(function(g){var r=gdoc(g.id).res,p=pts(g);
  if(r==='A'){t.A+=p.w;t.B+=p.s;t.played++}else if(r==='B'){t.B+=p.w;t.A+=p.s;t.played++}else if(r==='draw'){var h=(p.w+p.s)/2;t.A+=h;t.B+=h;t.played++}else t.left+=p.w});return t}
function finalWinner(){var t=totals();if(t.A>t.B)return 'A';if(t.B>t.A)return 'B';return cfg('final').tb||null}
function status(g){return gdoc(g.id).status||'todo'}
function elapsed(gid,key){var t=(gdoc(gid).timers||{})[key]||{};return(t.acc||0)+(t.at?Date.now()-t.at:0)}
function running(gid,key){var t=(gdoc(gid).timers||{})[key];return !!(t&&t.at)}
function statusChip(g){var s=status(g);return '<span class="chip-s '+s+'">'+({todo:'Not started',live:'Live',done:'Done'}[s])+'</span>'}

function resultLine(g){var d=gdoc(g.id);
  if(g.kind==='ind'&&d.win){return '<b>'+esc(pname(d.win))+'</b> '+tb(teamOf(d.win))+(d.run?' <span class="muted">then</span> '+esc(pname(d.run))+' '+tb(teamOf(d.run)):'')}

  if(g.kind==='tambola'){var n=TPRIZES.filter(function(x){return (DATA.tambola[x[0]]||{}).pid}).length;return n?n+' of '+TPRIZES.length+' prizes assigned':''}

}
function clockCard(g,key,label,extra){var run=running(g.id,key);
  return '<div class="clock-card '+key+'"><div class="cl">'+label+'</div><div class="clock" data-tm="'+g.id+':'+key+'">'+fmtT(elapsed(g.id,key)).replace('DNF','0:00.0')+'</div>'+(g.cap?'<div class="cap">Time cap '+fmtT(g.cap).replace('.0','')+'</div>':'')+
  '<div class="row"><button class="btn '+(run?'stop':'go')+'" data-a="'+(run?'tstop':'tstart')+'" data-k="'+key+'">'+(run?'Stop':'Start')+'</button><button class="btn ghost" data-a="treset" data-k="'+key+'">Reset</button></div>'+(extra||'')+'</div>'}

function vHeats(g){
  var d=gdoc(g.id),locked=d.status==='done',e=ui.e(g.id);if(!e.stage||g.stages.indexOf(e.stage)<0)e.stage=g.stages[0];
  var heats=g.stages.filter(function(x){return x.indexOf('Heat')===0});
  var ents=entriesOf(g.id).filter(function(x){return x.pid&&x.stage!=='Final'}),by={};ents.forEach(function(x){by[x.pid]=x});
  var fin=ents.filter(function(x){return x.v===1}),n=adv(g),h=gHead(g);
  if(g.id==='coin')h+='<div class="sec"><h2 class="h2">Stopwatch</h2>'+clockCard(g,'s','Stopwatch')+'</div>';
  h+='<div class="sec'+(locked?' lock':'')+'"><div class="sec-h"><h2 class="h2">'+esc(e.stage)+'</h2><small>'+ents.length+' in heats, '+fin.length+' in the final</small></div>';
  h+='<div class="chips" role="group" aria-label="Round">'+g.stages.map(function(s){return '<button class="chip '+(e.stage===s?'on':'')+'" data-a="estage" data-v="'+s+'" aria-pressed="'+(e.stage===s)+'">'+s+'</button>'}).join('')+'</div>';
  if(e.stage==='Batches'){
    var bs=ui.bsel&&ui.bsel[g.id]||heats[0];
    var list=presentPlayers(g.who).sort(function(a,b){return a.name.localeCompare(b.name)});
    h+='<p class="muted">Step 1. Choose a heat, then tap the players who play in it. Tap a player again to remove them.</p>';
    h+='<div class="chips" role="group" aria-label="Heat to fill">'+heats.map(function(x){var c=ents.filter(function(y){return y.stage===x}).length;return '<button class="chip '+(bs===x?'on':'')+'" data-a="bsel" data-v="'+x+'" aria-pressed="'+(bs===x)+'">'+x+' ('+c+')</button>'}).join('')+'</div>';
    h+='<div class="pgrid">'+list.map(function(p){var x=by[p.id],on=x&&x.stage===bs,other=x&&!on;
      return '<button class="pchip '+(on?'on':'')+(other?' dim':'')+'" data-a="hbatch" data-p="'+p.id+'" aria-pressed="'+(!!on)+'">'+tb(teamOf(p.id))+'<span class="grow nm">'+esc(p.name)+(x?'<small>'+esc(x.stage)+'</small>':'')+'</span></button>'}).join('')+'</div>';
    var left=list.filter(function(p){return !by[p.id]}).length;
    h+='<p class="muted">'+left+' players not in a heat yet. Heats of 6 to 8 players work best.</p>';
  }else if(e.stage!=='Final'){
    var hp=ents.filter(function(x){return x.stage===e.stage}).sort(function(a,b){return pname(a.pid).localeCompare(pname(b.pid))});
    var cnt=hp.filter(function(x){return x.v===1}).length;
    if(!hp.length)h+='<p class="empty">No players in this heat yet. Open Batches and add them.</p>';
    else{
      h+='<p class="muted">Step 2. Tap the '+(n||2)+' players who go through to the final. '+cnt+' selected.</p>';
      h+='<div class="pgrid">'+hp.map(function(x){var on=x.v===1;
        return '<button class="pchip '+(on?'on':'')+'" data-a="hfin" data-id="'+x.id+'" aria-pressed="'+on+'">'+tb(teamOf(x.pid))+'<span class="grow nm">'+esc(pname(x.pid))+(on?'<small>Going to the final</small>':'')+'</span></button>'}).join('')+'</div>';
      if(n&&cnt>n)h+='<div class="warn">'+cnt+' selected, but only '+n+' usually go through from a heat.</div>'}
  }else{
    var fl=fin.map(function(x){return x.pid}).sort(function(a,b){return pname(a).localeCompare(pname(b))});
    if(!fl.length)h+='<p class="empty">No finalists yet. Open each heat and tap the players who go through.</p>';
    else h+='<p class="muted">Tap Winner and Runner-up next to the right players.</p><ul class="list">'+fl.map(function(pid){
      return '<li>'+tb(teamOf(pid))+'<span class="grow nm">'+esc(pname(pid))+'</span><button class="btn '+(d.win===pid?'blue':'ghost')+'" data-a="hrole" data-p="'+pid+'" data-r="w" aria-pressed="'+(d.win===pid)+'">Winner</button><button class="btn '+(d.run===pid?'blue':'ghost')+'" data-a="hrole" data-p="'+pid+'" data-r="r" aria-pressed="'+(d.run===pid)+'">Runner-up</button></li>'}).join('')+'</ul>';
  }
  h+='</div>';
  h+='<div class="sec'+(locked?' lock':'')+'"><h2 class="h2">Winner and runner-up</h2>';
  h+='<div class="dec"><div class="card"><div class="eyebrow">Winner</div><div class="big">'+(d.win?esc(pname(d.win)):'Not set')+'</div>'+(d.win?tb(teamOf(d.win)):'')+'<label class="tick"><input type="checkbox" data-c="given" data-g="'+g.id+'" data-w="w" '+((d.given||{}).w?'checked':'')+'> Prize handed over</label></div>'+
     '<div class="card"><div class="eyebrow">Runner-up</div><div class="big">'+(d.run?esc(pname(d.run)):'Not set')+'</div>'+(d.run?tb(teamOf(d.run)):'')+'<label class="tick"><input type="checkbox" data-c="given" data-g="'+g.id+'" data-w="r" '+((d.given||{}).r?'checked':'')+'> Prize handed over</label></div></div></div>';
  h+=finishBar(g,!!d.win);
  return h;
}
function vInd(g){
  if(g.heats)return vHeats(g);
  var d=gdoc(g.id),locked=d.status==='done',e=ui.e(g.id);if(!e.stage||g.stages.indexOf(e.stage)<0)e.stage=g.stages[0];

    (d.win?'<div class="pod"><span class="pos">1</span><span class="who">'+esc(pname(d.win))+'</span>'+tb(teamOf(d.win))+'</div>'+(d.run?'<div class="pod"><span class="pos">2</span><span class="who">'+esc(pname(d.run))+'</span>'+tb(teamOf(d.run))+'</div>':''):'<div class="pod"><span class="who">Result not entered</span></div>')}
  else if(s.k==='team'){var d2=gdoc(s.g.id),p=pts(s.g);b='<div class="eyebrow">Game '+s.g.n+' · '+esc(s.g.cat)+'</div><div class="huge">'+esc(s.g.name)+'</div>'+
    (d2.res?'<div class="pod"><span class="who">'+(d2.res==='draw'?'Draw':'Team '+d2.res+' wins')+'</span></div><div class="eyebrow">'+(d2.res==='draw'?fmtP((p.w+p.s)/2)+' points each':'+'+fmtP(p.w)+' for the winner, +'+fmtP(p.s)+' for the other team')+'</div>':'<div class="pod"><span class="who">Result not entered</span></div>')}
  else if(s.k==='tambola'){b='<div class="eyebrow">Game 9 · Everyone</div><div class="huge">Tambola</div>'+TPRIZES.filter(function(x){return (DATA.tambola[x[0]]||{}).pid}).map(function(x){return '<div class="pod"><span class="eyebrow" style="width:120px;flex:none">'+x[1]+'</span><span class="who">'+esc(pname(DATA.tambola[x[0]].pid))+'</span>'+tb(teamOf(DATA.tambola[x[0]].pid))+'</div>'}).join('')}
  else if(s.k==='ootd'){b='<div class="eyebrow">Best dressed</div><div class="huge">Best OOTD</div>'+[['M','Male'],['F','Female']].map(function(x){var q=DATA.ootd[x[0]]||{};return '<div class="pod"><span class="eyebrow" style="width:90px;flex:none">'+x[1]+'</span><span class="who">'+(q.pid?esc(pname(q.pid)):'Not chosen')+'</span>'+(q.pid?tb(teamOf(q.pid)):'')+'</div>'}).join('')}
  else{var t=totals(),w=finalWinner();b='<div class="eyebrow">Final team score</div><div class="fin"><div class="a"><span class="eyebrow" style="color:#fff">TEAM A</span><b>'+fmtP(t.A)+'</b></div><div class="b"><span class="eyebrow" style="color:#0B1B2E">TEAM B</span><b>'+fmtP(t.B)+'</b></div></div><div class="huge">'+(w?'Team '+w+' wins':'Level on points')+'</div>'}
  return '<div class="show" role="dialog" aria-modal="true" aria-label="Announcement"><div class="show-b" key="'+i+'">'+b+'</div><div class="show-n"><button class="btn" data-a="showclose">Close</button><button class="btn" data-a="showprev" '+(i===0?'disabled':'')+'>Back</button><button class="btn gold" data-a="shownext" '+(i===S.length-1?'disabled':'')+'>Next</button></div></div>'}

function vSetup(){
  var h='<div class="page-h"><div class="eyebrow">Event settings</div><h1 class="h1">Setup</h1></div>';
  h+='<div class="sec"><h2 class="h2">Team game points</h2><ul class="list">'+GAMES.filter(function(g){return g.kind==='team'}).map(function(g){var p=pts(g);
    return '<li class="card"><div class="eyebrow">'+g.n+'. '+esc(g.name)+'</div><div class="row"><div class="grow"><label class="lbl" for="w-'+g.id+'">Winner</label><input class="fld sm" id="w-'+g.id+'" inputmode="decimal" data-c="pts" data-g="'+g.id+'" data-f="w" value="'+p.w+'"></div><div class="grow"><label class="lbl" for="s-'+g.id+'">Runner-up</label><input class="fld sm" id="s-'+g.id+'" inputmode="decimal" data-c="pts" data-g="'+g.id+'" data-f="s" value="'+p.s+'"></div></div></li>'}).join('')+'</ul><p class="muted">Individual games and Tambola give prizes only and carry no team points.</p></div>';
  h+='<div class="sec"><h2 class="h2">Finalists per heat</h2><ul class="list">'+HEATG().map(function(g){return '<li class="card"><label class="lbl" for="adv-'+g.id+'">'+esc(g.name)+': how many from each heat reach the final</label><input class="fld sm" id="adv-'+g.id+'" inputmode="numeric" data-c="adv" data-g="'+g.id+'" value="'+adv(g)+'"></li>'}).join('')+'</ul></div>';
  h+='<div class="sec"><h2 class="h2">Sync</h2><div class="card">'+(mode==='live'?'This scorecard is live. Anyone you share the page with sees every result as it is saved, and can enter results too.':mode==='err'?'Saving failed. Check the connection. Changes made now may not reach other phones.':mode==='connecting'?'Connecting to the shared scorecard.':'Live sync is not available here, so results are kept only on this phone and browser.')+'</div></div>';
  h+='<div class="sec"><h2 class="h2">Start over</h2>'+(ui.confirm?'<div class="warn">This erases every result, timer, prize and player change for all viewers.<div class="btns" style="margin-top:8px"><button class="btn danger" data-a="reset2">Yes, erase everything</button><button class="btn ghost" data-a="reset0">Cancel</button></div></div>':'<button class="btn ghost full" data-a="reset1">Erase all results</button>')+'</div>';
  return h;
}

/* ---------- render ---------- */
var TABS=[['board','Board'],['games','Games'],['players','Players'],['prizes','Prizes'],['finale','Finale']];
function route(){var h=location.hash.replace('#','')||'board';return h.indexOf('g-')===0?{tab:'games',gid:h.slice(2)}:{tab:h,gid:null}}
function render(){
  var app=document.getElementById('app');if(!app)return;var r=route(),y=window.scrollY,v;
  if(r.gid){var g=G(r.gid);v=!g?vGames():g.kind==='ind'?vInd(g):g.kind==='team'?vTeam(g):vTambola(g)}
  else{var VIEWS={board:vBoard,games:vGames,players:vPlayers,prizes:vPrizes,finale:vFinale,setup:vSetup};v=(VIEWS[r.tab]||vBoard)()}
  var sync={live:['live','Live sync'],local:['local','This phone only'],err:['err','Not saving'],connecting:['','Connecting']}[mode];
  app.innerHTML='<header class="top"><img src="'+LOGO+'" alt="Bharat Steel"><div class="brand"><b>Diwali Games</b><span>Scorekeeper</span></div><span class="sync '+sync[0]+'"><i></i>'+sync[1]+'</span><a class="gear" href="#setup" aria-label="Setup">Setup</a></header><main>'+v+'</main>'+
    '<div class="tabs"><nav aria-label="Sections">'+TABS.map(function(t){return '<a href="#'+t[0]+'" '+(r.tab===t[0]?'aria-current="page"':'')+'>'+ico(t[0])+t[1]+'</a>'}).join('')+'</nav></div>'+(ui.show?vShow():'');
  window.scrollTo(0,y);tick();
}
var pending=false;
function scheduleRender(){if(pending)return;pending=true;setTimeout(function(){pending=false;var a=document.activeElement;if(a&&(a.tagName==='INPUT'||a.tagName==='SELECT'||a.tagName==='TEXTAREA')&&a.closest('#app')){scheduleRender();return}render()},150)}
function tick(){document.querySelectorAll('[data-tm]').forEach(function(el){var p=el.dataset.tm.split(':'),g=G(p[0]),ms=elapsed(p[0],p[1]);el.textContent=fmtT(ms).replace('DNF','0:00.0');el.classList.toggle('over',!!(g&&g.cap&&ms>=g.cap))})}
setInterval(tick,100);

/* ---------- actions ---------- */
var gidNow=function(){return route().gid};
function setTimer(gid,key,o){var t={};t[key]=o;put('games',gid,{timers:t})}
function markLive(gid){if(status(G(gid))==='todo')put('games',gid,{status:'live'})}
var A={
 status:function(d){put('games',gidNow(),{status:d.s})},
 tstart:function(d){var g=gidNow();if(!running(g,d.k))setTimer(g,d.k,{acc:elapsed(g,d.k),at:Date.now()});markLive(g)},
 tstop:function(d){var g=gidNow();setTimer(g,d.k,{acc:elapsed(g,d.k),at:null})},
 treset:function(d){setTimer(gidNow(),d.k,{acc:0,at:null})},
 tboth:function(d){var g=gidNow();['A','B'].forEach(function(k){if(d.m==='start'){if(!running(g,k))setTimer(g,k,{acc:elapsed(g,k),at:Date.now()})}else if(running(g,k))setTimer(g,k,{acc:elapsed(g,k),at:null})});if(d.m==='start')markLive(g)},
 tbatch:function(d){ui.batch[gidNow()]=d.v;render()},
 estage:function(d){ui.e(gidNow()).stage=d.v;render()},
 hbatch:function(d){var gid=gidNow(),g=G(gid);if(gdoc(gid).status==='done')return;var heats=g.stages.filter(function(x){return x.indexOf('Heat')===0});
   ui.bsel=ui.bsel||{};var bs=ui.bsel[gid]||heats[0];var ex=entriesOf(gid).filter(function(x){return x.pid===d.p&&x.stage!=='Final'});
   if(ex.length&&ex[0].stage===bs){ex.forEach(function(x){del('entries',x.id)});var gd=gdoc(gid),u={};if(gd.win===d.p)u.win=null;if(gd.run===d.p)u.run=null;if('win' in u||'run' in u)put('games',gid,u);return}
   ex.forEach(function(x){del('entries',x.id)});put('entries',uid(),{gid:gid,stage:bs,pid:d.p,v:0,at:Date.now()});markLive(gid)},
 bsel:function(d){ui.bsel=ui.bsel||{};ui.bsel[gidNow()]=d.v;render()},
 hfin:function(d){var gid=gidNow();if(gdoc(gid).status==='done')return;var x=DATA.entries[d.id];if(!x)return;
   var nv=x.v===1?0:1;put('entries',d.id,{v:nv});if(nv===0){var gd=gdoc(gid),u={};if(gd.win===x.pid)u.win=null;if(gd.run===x.pid)u.run=null;if('win' in u||'run' in u)put('games',gid,u)}markLive(gid)},
 hrole:function(d){var gid=gidNow();if(gdoc(gid).status==='done')return;var gd=gdoc(gid),u={};
   if(d.r==='w'){if(gd.win===d.p)u.win=null;else{u.win=d.p;if(gd.run===d.p)u.run=null}}
   else{if(gd.run===d.p)u.run=null;else{u.run=d.p;if(gd.win===d.p)u.win=null}}
   put('games',gid,u);markLive(gid)},
 epick:function(d){var e=ui.e(gidNow());e.pid=e.pid===d.p?null:d.p;render()},
 einc:function(){var e=ui.e(gidNow());e.val=String((parseInt(e.val,10)||0)+1);render()},
 edec:function(){var e=ui.e(gidNow());e.val=String(Math.max(0,(parseInt(e.val,10)||0)-1));render()},
 eusetimer:function(){var g=gidNow(),e=ui.e(g);e.val=fmtT(elapsed(g,'s')).replace('DNF','0:00.0');render()},
 esave:function(){var gid=gidNow(),g=G(gid),e=ui.e(gid),v;var t=g.metric.type;
   v=t==='count'?parseInt(e.val,10):t==='dist'?parseFloat(String(e.val).replace(',','.')):parseT(e.val);
   if(v==null||isNaN(v)){toast('Enter a valid number');return}saveInd(gid,e,v)},
 edns:function(){var gid=gidNow(),e=ui.e(gid);saveInd(gid,e,null)},
 edel:function(d){del('entries',d.id)},
 usesug:function(){var g=G(gidNow()),r=rankInd(g);put('games',g.id,{win:r[0]?r[0].pid:null,run:r[1]?r[1].pid:null})},
 tsave:function(d){saveTeam(d.t,false)},
 tcap:function(d){saveTeam(d.t,'cap')},
 tdnf:function(d){saveTeam(d.t,'dnf')},
 decl:function(d){put('games',gidNow(),{res:d.r||null})},
 pick:function(d){ui.pick=ui.pick===d.key?null:d.key;render()},
 assign:function(d){var k=d.key.split(':');var col=k[0]==='t'?'tambola':'ootd';put(col,k[1],{pid:d.p||null,given:false});ui.pick=null;render()},
 filter:function(d){ui.filter=d.v;render()},
 absent:function(d){var o={};o[d.p]=!isAbsent(d.p);put('config','roster',{absent:o})},
 swap:function(d){var o={};o[d.p]=teamOf(d.p)==='A'?'B':'A';put('config','roster',{team:o})},
 tb:function(d){put('config','final',{tb:d.v||null})},
 showstart:function(){ui.show={i:0};document.body.style.overflow='hidden';render()},
 shownext:function(){ui.show.i++;render()},
 showprev:function(){ui.show.i=Math.max(0,ui.show.i-1);render()},
 showclose:function(){ui.show=null;document.body.style.overflow='';render()},
 copy:function(){var ta=document.getElementById('out');try{navigator.clipboard.writeText(ta.value).then(function(){toast('Copied')},function(){ta.select();toast('Press copy on the selected text')})}catch(e){ta.select();toast('Press copy on the selected text')}},
 reset1:function(){ui.confirm=1;render()},reset0:function(){ui.confirm=0;render()},
 reset2:function(){ui.confirm=0;COLS.forEach(function(c){Object.keys(DATA[c]).forEach(function(id){if(db)db.collection(c).doc(id).delete().catch(fail);delete DATA[c][id]})});ui._e={};ui.tt={};ui.hits={};if(!db)lsSave();render();toast('All results erased')}
};
function saveInd(gid,e,v){entriesOf(gid).filter(function(x){return x.pid===e.pid&&x.stage===e.stage}).forEach(function(x){delete DATA.entries[x.id];if(db)db.collection('entries').doc(x.id).delete().catch(fail)});
  var id=uid();put('entries',id,{gid:gid,stage:e.stage,pid:e.pid,v:v,at:Date.now()});markLive(gid);e.pid=null;e.val='';render()}
function saveTeam(t,mode2){var gid=gidNow(),g=G(gid),stage=g.batches?(ui.batch[gid]||g.batches[0]):'Run',v,typed=ui.tt[gid+t];
  if(mode2==='cap')v=g.cap;else if(mode2==='dnf')v=null;else if(typed){v=parseT(typed);if(isNaN(v)||v==null){toast('Enter a time like 1:23.4');return}}else{v=elapsed(gid,t);if(!v){toast('Run the timer or type a time first');return}}
  var hits=null;if(g.hits){var hv=(ui.hits[gid]||{})[t];hits=hv===undefined||hv===''?(mode2?0:9):parseInt(hv,10);if(isNaN(hits)||hits<0||hits>9){toast('Hits must be 0 to 9');return}}
  entriesOf(gid).filter(function(x){return x.team===t&&x.stage===stage}).forEach(function(x){delete DATA.entries[x.id];if(db)db.collection('entries').doc(x.id).delete().catch(fail)});
  var en={gid:gid,stage:stage,team:t,v:v,at:Date.now()};if(hits!=null)en.hits=hits;put('entries',uid(),en);
  if(running(gid,t))setTimer(gid,t,{acc:elapsed(gid,t),at:null});ui.tt[gid+t]='';markLive(gid);toast('Saved Team '+t+(g.batches?' '+stage:''))}

document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el||el.disabled)return;var f=A[el.dataset.a];if(f){ev.preventDefault();f(el.dataset)}});
document.addEventListener('input',function(ev){var el=ev.target,k=el.dataset&&el.dataset.i;if(!k)return;var gid=gidNow();
  if(k==='val')ui.e(gid).val=el.value;else if(k==='tt')ui.tt[gid+el.dataset.t]=el.value;else if(k==='hits'){(ui.hits[gid]=ui.hits[gid]||{})[el.dataset.t]=el.value;}
  var sb=document.querySelector('[data-a="esave"]');if(sb&&k==='val')sb.disabled=!(ui.e(gid).pid&&el.value!=='')});
document.addEventListener('change',function(ev){var el=ev.target,k=el.dataset&&el.dataset.c;if(!k)return;
  if(k==='win')put('games',gidNow(),{win:el.value||null});
  else if(k==='run')put('games',gidNow(),{run:el.value||null});
  else if(k==='given'){var o={};o[el.dataset.w]=el.checked;put('games',el.dataset.g,{given:o})}
  else if(k==='given-x')put(el.dataset.col,el.dataset.id,{given:el.checked});
  else if(k==='given-f'){var q={};q[el.dataset.f]=el.checked;put('config','final',q)}
  else if(k==='adv'){var m=parseInt(el.value,10);if(isNaN(m)||m<1||m>8){toast('Enter a number from 1 to 8');render();return}var q2={};q2[el.dataset.g]=m;put('config','adv',q2)}
  else if(k==='pts'){var n=parseFloat(String(el.value).replace(',','.'));if(isNaN(n)||n<0){toast('Enter points as a number');render();return}var p={};p[el.dataset.g]={};p[el.dataset.g][el.dataset.f]=n;put('config','points',p)}});
window.addEventListener('hashchange',function(){ui.pick=null;window.scrollTo(0,0);render()});

/* ---------- start ---------- */
render();
(function init(){
  var c=window.claude;
  if(!c||!c.use){lsLoad();mode='local';render();return}
  c.use('db').then(function(d){
    if(d){db=d;subscribe()}
    else{lsLoad();mode='local';render()}
  },function(){lsLoad();mode='local';render()});
})();
})();
</script>
